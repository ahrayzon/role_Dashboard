<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وظائف ريان – الفئات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<style>
  :root {
    --ink: #1c1b4b;
    --ink-soft: #55547a;
    --page: #f4f3fb;
    --card: #ffffff;
    --line: #e7e5f4;
    --hero: #24225a;
    --hero-2: #37347e;
    --yellow: #facc00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif; line-height: 1.55;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: max(16px, 4vw); }

  /* ---------- hero ---------- */
  header { background: linear-gradient(135deg, var(--hero) 0%, var(--hero-2) 100%); color: #fff; position: relative; overflow: hidden; }
  header::after {            /* yellow/black hazard stripe, as on the posters */
    content: ""; position: absolute; inset: auto 0 0 0; height: 12px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 22px, #1b1b1a 22px 44px);
  }
  .hero { display: flex; align-items: center; gap: 28px; padding-block: 38px 50px; }
  .hero img { width: 92px; height: auto; background: #fff; border-radius: 22px; padding: 10px; flex: none; }
  .eyebrow { color: var(--yellow); font-weight: 700; font-size: 1rem; margin: 0 0 4px; }
  h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.3rem); font-weight: 900; line-height: 1.25; }
  h1 span { color: var(--yellow); }
  .lead { margin: 10px 0 0; font-size: 1.1rem; color: #dcdbf5; max-width: 46ch; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-inline-start: auto; }
  .stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); border-radius: 18px; padding: 10px 20px; text-align: center; min-width: 108px; }
  .stat b { display: block; font-size: 2.1rem; font-weight: 900; color: var(--yellow); line-height: 1.15; }
  .stat small { font-size: .92rem; color: #e6e5fa; }

  /* ---------- quick jump chips ---------- */
  nav { display: flex; flex-wrap: wrap; gap: 10px; padding-block: 26px 6px; }
  nav a {
    text-decoration: none; color: #fff; font-weight: 700; font-size: .98rem;
    background: var(--c); padding: 8px 18px; border-radius: 999px;
    box-shadow: 0 4px 0 var(--cd); transition: transform .12s;
  }
  nav a:hover, nav a:focus-visible { transform: translateY(-2px); outline: none; }
  nav a b { background: rgba(255,255,255,.28); border-radius: 999px; padding: 0 9px; margin-inline-start: 6px; }

  /* ---------- cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 26px; padding-block: 22px 46px; align-items: start; }
  .card { background: var(--card); border-radius: 26px; overflow: hidden; box-shadow: 0 10px 30px rgba(36,34,90,.10); scroll-margin-top: 16px; }
  .top { background: linear-gradient(135deg, var(--c) 0%, var(--cd) 100%); color: #fff; padding: 22px 24px 20px; position: relative; }
  .top svg { width: 46px; height: 46px; background: rgba(255,255,255,.2); border-radius: 14px; padding: 9px; }
  .count { position: absolute; inset-inline-end: 22px; top: 22px; background: #fff; color: var(--cd); font-weight: 900; border-radius: 999px; padding: 4px 16px; font-size: 1rem; }
  .top h2 { margin: 12px 0 2px; font-size: 1.55rem; font-weight: 900; line-height: 1.3; }
  .top p { margin: 0; font-size: 1rem; opacity: .95; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .tags span { background: rgba(255,255,255,.22); border-radius: 999px; padding: 3px 13px; font-size: .88rem; font-weight: 700; }

  ul.roles { list-style: none; margin: 0; padding: 8px 24px 16px; }
  .roles li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .roles li:last-child { border-bottom: 0; }
  .r-title { font-weight: 700; font-size: 1.08rem; display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .r-no { flex: none; font-size: .8rem; font-weight: 700; color: var(--cd); background: var(--ct); border-radius: 8px; padding: 1px 9px; direction: ltr; }
  .r-place { color: var(--cd); font-weight: 700; font-size: .95rem; }
  .r-fact { color: var(--ink-soft); font-size: .95rem; }
  .r-hours { display: flex; gap: 7px; align-items: flex-start; font-weight: 700; font-size: .95rem; background: var(--ct); border-radius: 10px; padding: 4px 10px; margin-block: 5px 3px; }
  .r-hours svg { width: 17px; height: 17px; flex: none; margin-top: 4px; color: var(--cd); }
  .ltr { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
  .r-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-block: 2px; }
  .src { font-size: .82rem; font-weight: 900; border-radius: 999px; min-width: 26px; text-align: center; padding: 1px 8px; background: var(--sb); color: var(--sf); white-space: nowrap; }
  .roles li[hidden], .card[hidden] { display: none; }

  /* ---------- source filter ---------- */
  .filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 16px 0; }
  .filter > span { font-weight: 700; color: var(--ink-soft); margin-inline-end: 4px; }
  .filter button {
    font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
    border: 2px solid var(--sb); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 5px 16px;
    display: inline-flex; gap: 7px; align-items: center;
  }
  .filter button[aria-pressed="true"] { background: var(--sb); color: var(--sf); }
  .filter button:focus-visible { outline: 3px solid var(--hero-2); outline-offset: 2px; }
  .filter button b { opacity: .75; }

  /* ---------- footer ---------- */
  footer { background: var(--yellow); color: #1b1b1a; text-align: center; padding: 30px 16px 34px; }
  footer p { margin: 0; font-weight: 700; font-size: 1.1rem; }
  footer .cta { display: inline-block; margin-top: 8px; font-size: 1.9rem; font-weight: 900; color: var(--hero); text-decoration: none; }
  footer a.cta { background: var(--hero); color: #fff; border-radius: 999px; padding: 6px 34px; font-size: 1.5rem; }
  footer small { display: block; margin-top: 8px; font-weight: 600; }

  @media (max-width: 760px) {
    .hero { flex-wrap: wrap; gap: 18px; }
    .stats { margin-inline-start: 0; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

/* ---------------- render ---------------- */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
/* الأرقام والساعات تُعرض دائماً من اليسار لليمين */
const fmt = s => esc(s).replace(/(?<![A-Za-z\d])\d[\d:,.\/]*(?:–\d[\d:,.\/]*)?/g, m => `<span class="ltr">${m}</span>`);
const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const total = CATEGORIES.reduce((n, c) => n + c.roles.length, 0);
document.getElementById("n-roles").textContent = total;
document.getElementById("n-cats").textContent = CATEGORIES.length;

document.getElementById("nav").innerHTML = CATEGORIES.map(c =>
  `<a href="#${c.id}" style="--c:${c.c};--cd:${c.cd}">${esc(c.name)}<b>${c.roles.length}</b></a>`).join("");

document.getElementById("grid").innerHTML = CATEGORIES.map(c => `
  <section class="card" id="${c.id}" style="--c:${c.c};--cd:${c.cd};--ct:${c.ct}">
    <div class="top">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[c.icon]}</svg>
      <span class="count"><span class="cnt">${c.roles.length}</span> وظائف</span>
      <h2>${esc(c.name)}</h2>
      <p>${esc(c.who)}</p>
      <div class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
    </div>
    <ul class="roles">${c.roles.map(r => `
      <li data-src="${r.s}">
        <div class="r-title"><span>${esc(r.t)}</span>${r.no ? `<span class="r-no">${r.no}</span>` : ""}</div>
        <div class="r-meta">
          ${r.p ? `<span class="r-place">${esc(r.p)}</span>` : ""}
          ${SHOW_SOURCE ? `<span class="src" style="--sb:${SOURCES[r.s].sb};--sf:${SOURCES[r.s].sf}">${esc(SOURCES[r.s].name)}</span>` : ""}
        </div>
        ${r.h ? `<div class="r-hours">${CLOCK}<span>${fmt(r.h)}</span></div>` : ""}
        ${r.f ? `<div class="r-fact">${fmt(r.f)}</div>` : ""}
      </li>`).join("")}
    </ul>
  </section>`).join("");

/* ---------------- filter by source ---------------- */
if (SHOW_SOURCE) {
  const bar = document.getElementById("filter");
  const n = k => CATEGORIES.reduce((a, c) => a + c.roles.filter(r => r.s === k).length, 0);
  bar.innerHTML = `<span>الرمز:</span>` +
    `<button type="button" data-k="" aria-pressed="true" style="--sb:#55547a;--sf:#fff">الكل<b>${total}</b></button>` +
    Object.entries(SOURCES).map(([k, s]) =>
      `<button type="button" data-k="${k}" aria-pressed="false" style="--sb:${s.sb};--sf:${s.sf}">${esc(s.name)}<b>${n(k)}</b></button>`).join("");
  bar.addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    const k = btn.dataset.k;
    bar.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === btn));
    document.querySelectorAll(".card").forEach(card => {
      let shown = 0;
      card.querySelectorAll(".roles li").forEach(li => {
        li.hidden = !!k && li.dataset.src !== k;
        if (!li.hidden) shown++;
      });
      card.hidden = shown === 0;
      card.querySelector(".cnt").textContent = shown;
    });
  });
}
